# S19: secure code integration pipeline. Runs on every push and on every PR to main.
name: security-tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
  sast:
    name: Static security analysis (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit
      - run: bandit -r app -ll
  dependencies:
    name: Dependency vulnerabilities (pip-audit)
    runs-on: ubuntu-latest
    # Remove the next line once the team upgrades the pinned versions in requirements.txt
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt