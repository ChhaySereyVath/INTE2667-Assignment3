{% extends "base.html" %}
{% block title %}Activate your account - AEC Voting Platform{% endblock %}
{% block content %}
<section class="card">
  <h1>Activate your account</h1>
  <div id="notice" class="notice" hidden></div>
  <p id="activate-status" class="muted">Checking your activation link...</p>
  <p><a class="button" id="login-link" href="{{ url_for('pages.login_page') }}" hidden>Log in</a></p>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/activate.js') }}"></script>
{% endblock %}
