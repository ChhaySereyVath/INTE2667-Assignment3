{% extends "base.html" %}
{% block title %}Register - AEC Voting Platform{% endblock %}
{% block content %}
<section class="card">
  <h1>Create an account</h1>
  <div id="notice" class="notice" hidden></div>
  <ul id="field-errors" class="field-errors" hidden></ul>
  <form id="register-form" method="post" action="/auth/register">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" minlength="3" maxlength="40" required
           autocomplete="username">

    <label for="email">Email</label>
    <input type="email" id="email" name="email" maxlength="254" required autocomplete="email">

    <label for="password">Password</label>
    <input type="password" id="password" name="password" minlength="12" maxlength="128" required
           autocomplete="new-password">
    <p class="hint">At least 12 characters. Not a common password and not your username.</p>

    <button type="submit" class="button" id="register-button">Create account</button>
  </form>
</section>
{% endblock %}
{% block scripts %}
<script src="{{ url_for('static', filename='js/register.js') }}"></script>
{% endblock %}
